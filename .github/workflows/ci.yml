name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Test + Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma's generator needs a syntactically-valid DATABASE_URL
      # to read the datasource. A throwaway placeholder is enough —
      # `generate` and `validate` don't open a connection.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma — validate schema
        run: npx prisma validate

      - name: Prisma — generate client
        run: npx prisma generate

      - name: Vitest
        run: npm test
