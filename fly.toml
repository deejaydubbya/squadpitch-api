app = "squadpitch-api"
primary_region = "ord"

[build]

[deploy]
  # Runs on the temporary release machine before the rolling restart.
  # If it exits non-zero, the deploy aborts and the prior release
  # keeps serving traffic.
  #
  # Two steps chained with &&:
  #   1. npx prisma migrate deploy — apply any pending migrations.
  #      The supported pattern in place of boot-time migrations,
  #      which would race when multiple machines come up.
  #   2. node scripts/backfillCampaigns.js — idempotent backfill of
  #      Campaign rows for legacy Draft.campaignId strings. Skips
  #      groups that already have a Campaign row, so after the
  #      first successful run this is a cheap no-op on every
  #      subsequent deploy (and a safety net against any future
  #      code path that generates an orphan campaignId).
  release_command = "sh -c 'npx prisma migrate deploy && node scripts/backfillCampaigns.js && node scripts/seedFlags.js'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Health check — Fly restarts the machine if this fails 3 times in a row.
  # Catches hung processes, OOM zombies, and dead DB connections.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/ready"

[env]
  NODE_ENV = "production"
  ENABLE_WORKERS = "true"
  AI_PROVENANCE_RESPONSE_HEADERS_ENABLED = "true"
  PUBLIC_SITES_BASE_DOMAIN = "squadpitchsites.com"
  STRIPE_EXPECTED_MODE = "live"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
  swap_size_mb = 512
